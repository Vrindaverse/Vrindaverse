  <text x="32" y="142" font-family="'Courier New', monospace" font-size="15" fill="#5C5C5C">Productivity dashboard with a calm, focused</text>
  <text x="32" y="166" font-family="'Courier New', monospace" font-size="15" fill="#5C5C5C">interface. Built for people who ship.</text>

  <g font-family="'Courier New', monospace" font-size="12" fill="#2A2A2A">
    <rect x="34" y="196" width="86" height="30" rx="8" fill="#2D2D2D"/>
