<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-label="Commit: a productivity dashboard with a calm, focused interface. Built with Next.js, TypeScript, and Tailwind. Live at commit-ivory.vercel.app.">
  <defs>
    <path id="csp" d="M0 -10 C1.5 -3 3 -1.5 10 0 C3 1.5 1.5 3 0 10 C-1.5 3 -3 1.5 -10 0 C-3 -1.5 -1.5 -3 0 -10 Z"/>
    <clipPath id="cc"><rect x="8" y="8" width="532" height="272" rx="20"/></clipPath>
  </defs>
  <rect x="16" y="16" width="532" height="272" rx="20" fill="#F2B48E"/>
  <rect x="8" y="8" width="532" height="272" rx="20" fill="#FFFDF8"/>
  <g clip-path="url(#cc)"><rect x="8" y="8" width="532" height="96" fill="#B8D8F8"/></g>
  <line x1="8" y1="104" x2="540" y2="104" stroke="#2D2D2D" stroke-width="3"/>
  <rect x="8" y="8" width="532" height="272" rx="20" fill="none" stroke="#2D2D2D" stroke-width="3"/>

  <text x="32" y="70" font-family="'Arial Black', Impact, sans-serif" font-size="30" letter-spacing="1" fill="#2A2A2A">COMMIT</text>
