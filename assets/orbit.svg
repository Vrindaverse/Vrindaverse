<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Rotate animation for rings -->
    <rotate id="rotateRings" angle="0" center="200 200">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 200 200"
        to="360 200 200"
        dur="20s"
        repeatCount="indefinite"/>
    </rotate>

    <!-- Skill node glow -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Center node -->
  <circle cx="200" cy="200" r="12" fill="#ff4ecd">
    <filter use="nodeGlow"/>
  </circle>

  <!-- Center label -->
  <text x="200" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7b61ff">ME</text>

  <!-- Orbital rings data: skill, radius, speed, color -->
  <!-- TypeScript - fast inner ring -->
  <g>
    <line x1="200" y1="0" x2="200" y2="120" stroke="#00f5d4" stroke-width="2">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 200 200"
        to="360 200 200"
        dur="8s"
        repeatCount="indefinite"/>
    </line>
    <text x="195" y="10" text-anchor="middle" fill="#00f5d4" font-family="Georgia, serif" font-size="10">TypeScript</text>
  </g>

  <!-- Next.js - second ring -->
  <g transform="rotate(0 200 200)">
    <line x1="200" y1="0" x2="200" y2="160" stroke="#7b61ff" stroke-width="2">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 200 200"
        to="360 200 200"
        dur="10s"
        repeatCount="indefinite"/>
    </line>
    <text x="195" y="10" text-anchor="middle" fill="#7b61ff" font-family="Georgia, serif" font-size="10">Next.js</text>
  </g>

  <!-- Python - third ring -->
  <g transform="rotate(30 200 200)">
    <line x1="200" y1="0" x2="200" y2="190" stroke="#ff4ecd" stroke-width="2">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 200 200"
        to="360 200 200"
        dur="12s"
        repeatCount="indefinite"/>
    </line>
    <text x="195" y="10" text-anchor="middle" fill="#ff4ecd" font-family="Georgia, serif" font-size="10">Python</text>
  </g>

  <!-- Linux - fourth ring -->
  <g transform="rotate(60 200 200)">
    <line x1="200" y1="0" x2="200" y2="220" stroke="#7b61ff" stroke-width="2">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 200 200"
        to="360 200 200"
        dur="14s"
        repeatCount="indefinite"/>
    </line>
    <text x="195" y="10" text-anchor="middle" fill="#7b61ff" font-family="Georgia, serif" font-size="10">Linux</text>
  </g>

  <!-- Security - fifth ring -->
  <g transform="rotate(90 200 200)">
    <line x1="200" y1="0" x2="200" y2="240" stroke="#ff4ecd" stroke-width="2">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 200 200"
        to="360 200 200"
        dur="16s"
        repeatCount="indefinite"/>
    </line>
    <text x="195" y="10" text-anchor="middle" fill="#ff4ecd" font-family="Georgia, serif" font-size="10">Security</text>
  </g>

  <!-- Chess - outermost ring -->
  <g transform="rotate(120 200 200)">
    <line x1="200" y1="0" x2="200" y2="260" stroke="#00f5d4" stroke-width="2">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 200 200"
        to="360 200 200"
        dur="18s"
        repeatCount="indefinite"/>
    </line>
    <text x="195" y="10" text-anchor="middle" fill="#00f5d4" font-family="Georgia, serif" font-size="10">Chess</text>
  </g>
</svg>