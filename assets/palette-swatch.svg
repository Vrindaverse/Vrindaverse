<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Commit-style palette and type swatch: ivory paper, ink, muted, seven sticker pastels, and display, serif, and mono type samples.">
  <defs>
