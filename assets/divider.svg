<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="44" viewBox="0 0 1200 44" role="img" aria-label="Decorative dashed divider with sparkle marks.">
  <defs>
    <style><![CDATA[
      .tw { animation: tw 4.5s ease-in-out infinite; }
      .t1 { animation-delay: 0s; }
      .t2 { animation-delay: .6s; }
      .t3 { animation-delay: 1.2s; }
      @keyframes tw { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .tw { animation: none; } }
    ]]></style>
    <path id="spark" d="M0 -10 C1.5 -3 3 -1.5 10 0 C3 1.5 1.5 3 0 10 C-1.5 3 -3 1.5 -10 0 C-3 -1.5 -1.5 -3 0 -10 Z"/>
  </defs>
  <rect x="2" y="6" width="1196" height="32" rx="16" fill="#1C1B19" stroke="#F8F5F0" stroke-width="3"/>
  <line x1="40" y1="22" x2="512" y2="22" stroke="#F8F5F0" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <line x1="688" y1="22" x2="1160" y2="22" stroke="#F8F5F0" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <use href="#spark" transform="translate(562,22) scale(1)" fill="#F8F5F0" class="tw t1"/>
  <use href="#spark" transform="translate(600,22) scale(1.6)" fill="#F8F5F0" class="tw t2"/>
  <use href="#spark" transform="translate(638,22) scale(1)" fill="#F8F5F0" class="tw t3"/>
</svg>
