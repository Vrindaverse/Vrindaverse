<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Nikhil Mahalik, aka Vrinda. Full-stack developer. Stickers: full-stack, AI and ML, security, architecture. B.Tech CSE 2028, Technocrats Institute of Technology and Science, Bhopal.">
  <defs>
