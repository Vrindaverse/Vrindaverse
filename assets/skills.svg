    <path id="sspark" d="M0 -10 C1.5 -3 3 -1.5 10 0 C3 1.5 1.5 3 0 10 C-1.5 3 -3 1.5 -10 0 C-3 -1.5 -1.5 -3 0 -10 Z"/>
  </defs>

  <rect x="16" y="16" width="1160" height="448" rx="20" fill="#4A4166"/>
  <rect x="8" y="8" width="1160" height="448" rx="20" fill="#1C1B19" stroke="#F8F5F0" stroke-width="3"/>
  <rect x="8" y="8" width="1160" height="448" rx="20" fill="url(#sdots)"/>

