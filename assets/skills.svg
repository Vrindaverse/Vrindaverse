  <use href="#sspark" transform="translate(1140,428) scale(1.3)" fill="#F8F5F0"/>
  <text x="48" y="430" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#B7B1A6">built with a bias for shipping</text>
